services:
    currency-service:
        build:
            context: ./currency-service
        container_name: currency-service-container
        volumes:
            - ./currency-service:/var/www/html
        networks:
            - app_network
        expose:
            - "9000"
        depends_on:
            - db
            - rabbitmq

    report-generation-service:
        build:
            context: ./report-generation-service
        container_name: report-generation-service-container
        volumes:
            - ./report-generation-service:/var/www/html
        networks:
            - app_network
        expose:
            - "9000"
        depends_on:
            - db
            - rabbitmq

    nginx:
        image: nginx:latest
        container_name: nginx-reverse-proxy
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf
            - .:/var/www/html
        ports:
            - "8080:80"
        networks:
            - app_network
        depends_on:
            - currency-service
            - report-generation-service

    db:
        image: postgres:latest
        container_name: postgres-db
        environment:
            POSTGRES_USER: symfony
            POSTGRES_PASSWORD: symfony
            POSTGRES_DB: symfony
        volumes:
            - db_data:/var/lib/postgresql/data
        networks:
            - app_network

    rabbitmq:
        image: "rabbitmq:management"
        container_name: rabbitmq-server
        ports:
            - "15672:15672"
            - "5672:5672"
        networks:
            - app_network

networks:
    app_network:
        driver: bridge

volumes:
    db_data:
